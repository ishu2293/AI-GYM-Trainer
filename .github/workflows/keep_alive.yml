
name: Diagnose Streamlit App

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect redirect
        run: |
          URL="https://ai-gym-trainer-ishwari.streamlit.app/"

          echo "Checking initial response..."

          curl -sS \
            --max-time 30 \
            -D - \
            -o /dev/null \
            "$URL"
