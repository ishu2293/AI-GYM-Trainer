name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 4 hours to stay well under Streamlit's sleep threshold
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit app
        uses: gpenessot/streamlit-keep-alive@v1
        with:
          app-urls: |
            https://ai-gym-trainer-ishwari.streamlit.app/
          timeout: 120