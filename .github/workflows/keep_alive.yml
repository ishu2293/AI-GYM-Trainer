
name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest

    steps:
      - name: Wake up Streamlit app
        run: |
          echo "Pinging AI Gym Trainer..."
          curl -L --retry 3 --retry-delay 10 \
            --max-time 120 \
            --fail \
            https://ai-gym-trainer-ishwari.streamlit.app/
          echo "Ping completed successfully!"
