
name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit app
        run: |
          URL="https://ai-gym-trainer-ishwari.streamlit.app/"

          STATUS=$(curl -sS -L \
            --max-redirs 10 \
            --max-time 120 \
            -o /dev/null \
            -w "%{http_code}" \
            "$URL") || true

          echo "HTTP Status: $STATUS"
